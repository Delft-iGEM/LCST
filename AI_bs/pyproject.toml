[project]
name = "elp-lcst"
version = "0.1.0"
description = "Predict the LCST / inverse transition temperature (Tt) of elastin-like polypeptide (ELP) sequences."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[project.scripts]
elp-lcst = "elp_lcst.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elp_lcst"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
